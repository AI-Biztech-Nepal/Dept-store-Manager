<!-- Supabase -> Authentication -> Emails -> "Reset password".
     Subject: {{ .Token }} is your Store Books password reset code
     Used for both "Forgot password?" on the sign-in screen and "Change password" in the profile. -->
<div style="margin:0;padding:24px 12px;background:#f3f4f6;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <div style="max-width:440px;margin:0 auto;background:#ffffff;border-radius:16px;padding:32px 28px;">
    <div style="width:48px;height:48px;border-radius:12px;background:#2563eb;color:#ffffff;font-size:24px;line-height:48px;text-align:center;margin-bottom:20px;">&#127978;</div>
    <h1 style="margin:0 0 8px;font-size:22px;color:#111827;">Reset your password</h1>
    <p style="margin:0 0 20px;font-size:14px;line-height:1.5;color:#4b5563;">
      Someone asked to change the password for {{ .Email }}. Enter this code in Store Books to choose a new one.
    </p>
    <div style="margin:0 0 20px;padding:16px;background:#eff6ff;border-radius:12px;text-align:center;font-size:32px;font-weight:700;letter-spacing:10px;color:#1d4ed8;">
      {{ .Token }}
    </div>
    <p style="margin:0 0 6px;font-size:13px;line-height:1.5;color:#6b7280;">The code expires soon, so use it right away. Never share it with anyone.</p>
    <p style="margin:0;font-size:13px;line-height:1.5;color:#6b7280;">Didn't ask for this? Ignore this email - your password stays the same.</p>
  </div>
</div>
