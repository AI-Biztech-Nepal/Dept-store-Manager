name: Deploy to Vercel

# Every push to main pings the project's Vercel deploy hook, which builds and
# deploys main to https://dept-store-manager.vercel.app. The hook URL is a
# secret (anyone holding it can trigger a deploy), so it lives in the repo's
# Actions secrets as VERCEL_DEPLOY_HOOK, never in this file.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel deploy hook
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK" ]; then
            echo "::warning::VERCEL_DEPLOY_HOOK secret is not set, skipping the deploy"
            exit 0
          fi
          curl --fail --silent --show-error -X POST "$VERCEL_DEPLOY_HOOK"
